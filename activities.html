<!DOCTYPE html>
<html>
<head>
  <title>Activities</title>
  <meta charset="utf-8">
  <meta name="keywords" content="HTML5, CSS3, JavaScript">
  <link rel="stylesheet" href="css/activities.css">
  <link rel="stylesheet" href="css/header-footer.css">
</head>


<body>
	<header id="header-container" xlu-include-file="header.html"></header>
<div id="container">

	<div id="main_container">

		<div id="search_container">
			<form >
				<input type="text" placeholder="Search activity..." name="activity">
				<button type="submit">
					<img src="lupa.png" width="15">
				</button>
			</form>
		</div>

		<aside id="filterbar">

			<h2 id="filter">Filters</h2>
            <form action="filter">
                <h3>Price:</h3>
				<div class="filter-row">
					<input type="number" name="price_min" min="0" placeholder="min">
					<span>-</span>
					<input type="number" name="price_max" min="0" placeholder="max">
				</div>
                <h3>Duration:</h3>
				<div class="filter-row">
					<input type="number" name="duration_min" min="0" placeholder="min">
					<span>-</span>
					<input type="number" name="duration_max" min="0" placeholder="max">
				</div>
                <h3>Language:</h3>
                <select id="idioma-actividad" name="language">
                    <option value="all">All languages</option>
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
                
                <h3>Stars:</h3>
                <select id="stars-actividad" name="stars">
                    <option value="all">All</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
				
				<label><input type="checkbox" name="categoria" value="accibility"> Accessible</label>
                
                <button type="button">Apply</button>
            </form>
        </aside>

        <section >
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
        </section>

	</div>

	<div id="footer_container" xlu-include-file="footer.html"></div>
</div>

<script src="scripts/xlu-include-file.js"></script>
<script src="scripts/header.js"></script>
<script>

    xLuIncludeFile();

</script>

</body>
</html>
