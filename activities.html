<!DOCTYPE html>
<html>
<head>
  <title>Activities</title>
  <meta charset="utf-8">
  <meta name="keywords" content="HTML5, CSS3, JavaScript">
  <link rel="stylesheet for modals" href="css/modals.css">
  <link rel="stylesheet for activities" href="css/activities.css">
  <link rel="stylesheet for header and footer" href="css/header-footer.css">
  <link rel="stylesheet for icons" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>


<body>
	<header id="header-container" xlu-include-file="header.html"></header>

	<main id="main_container">

		<div id="search_container">
			<form >
				<input type="text" placeholder="Search activity..." name="activity">
				<button type="submit">
					<i class='bx bx-search'></i>
				</button>
			</form>
		</div>

		<aside id="filterbar">

			<h2 id="filter">Filters</h2>
            <form action="filter">
                
                <h3>Price:</h3>
				<div class="filter-row">
					<input type="number" name="price_min" min="0" placeholder="min">
					<span>-</span>
					<input type="number" name="price_max" min="0" placeholder="max">
				</div>

                <h3>Duration:</h3>
				<div class="filter-row">
					<input type="number" name="duration_min" min="0" placeholder="min">
					<span>-</span>
					<input type="number" name="duration_max" min="0" placeholder="max">
				</div>

                <h3>Time:</h3>
                <select name="time_block">
                    <option value="all">Any time</option>
                    <option value="morning">Morning (06:00–12:00)</option>
                    <option value="afternoon">Afternoon (12:00–18:00)</option>
                    <option value="evening">Evening (18:00–22:00)</option>
                    <option value="night">Night (22:00–06:00)</option>
                </select>

                <h3>Language:</h3>
                <select id="idioma-actividad" name="language">
                    <option value="all">All languages</option>
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
                
                <h3>Stars:</h3>
                <select id="stars-actividad" name="stars">
                    <option value="all">All</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
				
				<label><input type="checkbox" name="categoria" value="accibility"> Accessible</label>
                
                <button type="button">Apply</button>
            </form>
        </aside>

        <section >
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
            <article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
			<article class="activity" xlu-include-file="activity2.html"></article>
        </section>

	</main>

	<footer id="footer_container" xlu-include-file="footer.html"></footer>


<script src="scripts/xlu-include-file.js"></script>
<script src="scripts/header.js"></script>
<script>

    xLuIncludeFile();

</script>

</body>
</html>
