<article class="activity-card activity">
    <span class="activity-id" hidden>{{ activity.id }}</span>
    <img class="activity-image" [src]="activity.image" [alt]="activity.name">
    <a class="activity-name" [href]="'/activities/' + activity.id">{{ activity.name }}</a>
    <p class="valoracion" aria-label="Rating">{{ activity.rating }}</p>
</article>
