<img class="activity-image" [src]="activity.image[0]" [alt]="activity.name">

<div class="activity-info">
  <a class="activity-name" [routerLink]="['/activities', activity.id]">
    {{ activity.name }}
  </a>
  <p class="valoracion" aria-label="Rating">
    <i class="bi bi-star-fill text-warning"></i> {{ activity.rating }}
  </p>
</div>
