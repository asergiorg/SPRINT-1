<article class="activity-card activity">
    <span class="activity-id" hidden></span>
    <img class="activity-image" [src]="activity.image">
    <div class="description">
        <a class="activity-name">{{ activity.name }}</a>
        <p class="price">{{ activity.price }}</p>
        <p class="valoracion" aria-label="">{{ activity.rating }}</p>
    </div>
</article>
