<article class="activity-card reservation">
    <h3>{{reservation.activity}}</h3>
    <div class="row"><dt>Date</dt><dd id="row-date">{{ reservation.date }}</dd></div>
    <div class="row"><dt>Time</dt><dd id="row-time">{{ reservation.time }}</dd></div>
    <div class="row"><dt>Participants</dt><dd id="row-people">{{ reservation.participants }}</dd></div>
    <div class="row"><dt>Price</dt><dd id="row-price">{{ reservation.price }}</dd></div>
</article>
