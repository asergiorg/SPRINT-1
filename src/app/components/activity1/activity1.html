<span class="activity-id" hidden></span>
<div (click)="onClick()">
	<img class="activity-image" alt="Activity Image" [src]="activity.image">
	<div class="description">
		<h3 class="activity-name">{{ activity.name }}</h3>
		<p class="activity-description">{{ activity.description }}</p>
	</div>
</div>
