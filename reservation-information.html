<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reservation Information</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    body{
        font-family:Arial,Helvetica,sans-serif;
        background:#f5f6fa;
        color:#222;
        padding:24px
    }

    .container{
        max-width:900px;
        margin:0 auto
    }

    .card{background:#fff;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,0.06)
    }

    .row{display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 0;
        border-bottom:1px solid #f0f0f0
    }

    .row:last-child{
        border-bottom:0
    }

    .title{
        font-size:24px;
        font-weight: bold;
        text-decoration: none;
        color: #333;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .card-header{
      width: 100%;
      justify-content: space-between;
      align-items: center;
      margin-top:16px;
      display:flex;
    }

    .actions {
      justify-content: center;
      margin-top:16px;
      gap: 5px;
      display:flex;
    }

    button{
        padding:8px 12px;
        border-radius:6px;
        border:1px solid #ccc;
        background:#fff;
        cursor:pointer
    }

    .card-header i{
      position: relative;
      font-size: 26px;
    }

    #payment-section {
      margin-top:14px;
    }

    #payment-methods {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
      margin: 0 auto;
      max-width: 70%;
    }

  #pm-info {
    margin-top:8px;
    color:#555;
    text-align: center;
  }

    /* estilo para pares definición */
    .row dt{font-weight:600}
    .row dd{margin:0}
    article footer.actions{margin-top:16px}
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Reservation Information</h1>
    </header>
    <section id="content">
      <article id="reservation-card" class="card" aria-labelledby="res-id">
        <header class="card-header">
          <a href="activity-information.html"><div class="title">Hiking</div></a>
          <i class='bx bxs-edit-alt' onclick="location.href='activity-information.html'"></i>
        </header>
        <div class="row"><dt>Reservation Holder</dt><dd id="row-name">Juan Pérez</dd></div>
        <div class="row"><dt>Date</dt><dd id="row-date">2026-02-25</dd></div>
        <div class="row"><dt>Time</dt><dd id="row-time">10:00</dd></div>
        <div class="row"><dt>Participants</dt><dd id="row-people">2</dd></div>
        <div class="row"><dt>Price</dt><dd id="row-price">€60.00</dd></div>
        <div class="row"><dt>Status</dt><dd id="row-status">Pending</dd></div>

        <section id="payment-section" aria-label="Métodos de pago">
          <h3>Select payment method</h3>
          <div id="payment-methods">
            <button class="pm-btn" data-method="google">Google Pay</button>
            <button class="pm-btn" data-method="card">MasterCard</button>
            <button class="pm-btn" data-method="card" >Visa</button>
            <button class="pm-btn" data-method="paypal">PayPal</button>
          </div>
          <p id="pm-info">You will be redirected to the selected payment gateway.</p>
        </section>
        <footer class="actions">
            <button id="confirm" onclick="location.href='user-activities.html'">Confirm</button>
            <button id="cancel" onclick="location.href='activity-information.html'">Cancel</button>
        </footer>
      </article>
    </section>
  </main>

  
</body>
</html>
