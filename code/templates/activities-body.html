<main id="main_container">

    <div id="search_container">
        <form >
            <input type="search" placeholder="Search activity..." name="activity">
            <button type="submit">
                <i class='bx bx-search'></i>
            </button>
        </form>
    </div>

    <aside id="filterbar">

        <h2 id="filter">Filters</h2>
        <form action="filter">
            
            <h3>Price:</h3>
            <div class="filter-row">
                <input type="number" name="price_min" min="0" placeholder="min">
                <span>-</span>
                <input type="number" name="price_max" min="0" placeholder="max">
            </div>

            <h3>Duration:</h3>
            <div class="filter-row">
                <input type="number" name="duration_min" min="0" placeholder="min">
                <span>-</span>
                <input type="number" name="duration_max" min="0" placeholder="max">
            </div>

            <h3>Time:</h3>
            <select name="time_block">
                <option value="all">Any time</option>
                <option value="morning">Morning (06:00–12:00)</option>
                <option value="afternoon">Afternoon (12:00–18:00)</option>
                <option value="evening">Evening (18:00–22:00)</option>
                <option value="night">Night (22:00–06:00)</option>
            </select>

            <h3>Language:</h3>
            <select id="idioma-actividad" name="language">
                <option value="all">All languages</option>
                <option value="es">Spanish</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>
            
            <h3>Stars:</h3>
            <select id="stars-actividad" name="stars">
                <option value="all">All</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            
            <h3>Difficulty:</h3>
            <select id="difficulty-actividad" name="difficulty">
                <option value="all">All</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            
            <button type="button">Apply</button>
        </form>
    </aside>

    <section data-content-id="activities" data-template="templates/activity2.html" data-json="json/activities.json"></section>

</main>
