<main id="main_container">
    <section class="page-header" data-content-id="activities" data-json="json/activities.json">
        <h1 class="activity-title" data-field="name"></h1>
        <div class="gallery">
            <img id="img1" data-field="image" alt="Activity Image 1">
            <img id="img2" data-field="image" alt="Activity Image 2">
            <img id="img3" data-field="image" alt="Activity Image 3">
        </div>
    </section>

    <div id="wrapper">

        <main id="main_section">
            <article class="activity-details" data-content-id="activities" data-json="json/activities.json">
                <div id="header-main-section">
                    <h2>Activity Description</h2>
                    <button id="reservation-menu">Reservate</button>
                </div>
                <p class="activity-description" data-field="description"></p>

                <div class="activity-grid">
                    <div class="activity-meta-box"> <strong>Duration</strong><div data-field="duration"></div></div>
                    <div class="activity-meta-box"> <strong>Language</strong><div data-field="languages"></div></div>
                    <div class="activity-meta-box"> <strong>Difficulty</strong><div data-field="difficulty"></div></div>
                    <div class="activity-meta-box"> <strong>Price</strong><div id="price" data-field="price"></div></div>
                </div>
           
            <!-- Reviews -->
                <section class="review" aria-labelledby="reviews-heading">
                    <h2 id="reviews-heading">Reviews</h2>
                    <article class="review-item">
                        <div class="review-content">
                            <div class="review-header">
                                <div class="avatar">
                                    <img src="#.jpg" width="30" height="30">
                                    <h3> Username </h3>
                                </div>
                                <div id="rating" class="rating" role="img" aria-label="Calificación: 0 de 5 estrellas">
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                </div>
                            </div>
                            <div class="input-box">
                                <textarea class="comment-box" maxlength="300" placeholder="Leave your comment here..." rows="3"></textarea>
                                <div class="char-counter">0 / 300</div>
                            </div>
                            <div class="submit-action">
                                <button type="button" class="submit-btn"> Submit </button>
                            </div>
                        </div>   
                    </article>
                    <!-- Reviews from other users -->
                    <section id="reviews" data-content-id="reviews" data-json="json/reviews.json" data-template="templates/review.html"></section>
                </section>
            </article>
        </main>
    

        <aside class="reservation-panel">
            <div class="panel-card">
                <span id="cross" class='bx bx-x'></span>
                <h2>Reservation</h2>
                <form class="reservation-form" id="reservationForm" aria-label="Formulario de reserva">
                    
                    <div class="calendar">
                        <div class="calendar-header">
                            <div class="title">Calendar</div>
                            <div class="calendar-controllers">
                                <button type="button" class="small-btn" id="prevMonth" aria-hidden="true">◀</button>
                                <h3 class="month-year" id="monthDisplay"></h3>
                                <button type="button" class="small-btn" id="nextMonth" aria-hidden="true">▶</button>
                            </div>
                        </div>
                        <div class="calendar-grid" id="calendarGrid"></div>
                    </div>

                    <div class="form-group">
                        <label>Hour</label>
                        <div class="preset-times">
                            <button type="button" class="preset">08:00</button>
                            <button type="button" class="preset">09:30</button>
                            <button type="button" class="preset">11:00</button>
                            <button type="button" class="preset">12:00</button>
                            <button type="button" class="preset">14:00</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="people">Participants</label>
                        <div class="people-selector">
                            <button type="button" class="people-btn" id="btnMinus">−</button>
                            <input type="number" id="people" name="people" value="1" min="1" max="20" readonly>
                            <button type="button" class="people-btn" id="btnPlus">+</button>
                        </div>
                    </div>
                    <button type="submit" class="reserve-btn">Make Reservation</button>
                </form>
            </div>
        </aside>
    </div>
</main>
