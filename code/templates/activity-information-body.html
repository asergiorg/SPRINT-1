<main id="main_container">
    <section class="page-header" data-content-id="activities" data-json="json/activities.json">
        <h1 class="activity-title" data-field="name"></h1>
        <div class="gallery">
            <img src="">
            <img src="">
            <img src="">
        </div>
    </section>

    <div id="wrapper">

        <main id="main_section">
            <article class="activity-details" data-content-id="activities" data-json="json/activities.json">
                <h2>Activity Description</h2>
                <p class="activity-description" data-field="description"></p>

                <div class="activity-grid">
                    <div class="activity-meta-box"> <strong>Duration</strong><div data-field="duration"></div></div>
                    <div class="activity-meta-box"> <strong>Language</strong><div data-field="languages"></div></div>
                    <div class="activity-meta-box"> <strong>Difficulty</strong><div data-field="difficulty"></div></div>
                    <div class="activity-meta-box"> <strong>Price</strong><div data-field="price"></div></div>
                </div>
           
            <!-- Reviews -->
                <section class="review" aria-labelledby="reviews-heading">
                    <h2 id="reviews-heading">Reviews</h2>
                    <article class="review-item">
                        <div class="review-content">
                            <div class="review-header">
                                <div class="avatar">
                                    <img src="#.jpg" width="30" height="30">
                                    <h3> Username </h3>
                                </div>
                                <div id="rating" class="rating" role="img" aria-label="Calificación: 0 de 5 estrellas">
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                    <span class="star">☆</span>
                                </div>
                            </div>
                            <textarea class="comment-box" placeholder="Leave your comment here..." rows="3"></textarea>
                            <div class="submit-action">
                                <button type="button" class="submit-btn"> Submit </button>
                            </div>
                        </div>   
                    </article>
                    <!-- Reviews from other users -->
                    <article class="review-item" xlu-include-file="templates/review.html"></article>
                    <article class="review-item" xlu-include-file="templates/review.html"></article>
                    <article class="review-item" xlu-include-file="templates/review.html"></article>
                </section>
            </article>
        </main>
    

        <aside class="reservation-panel">
            <div class="panel-card">
                <h2>Reservation</h2>
                <form class="reservation-form" aria-label="Formulario de reserva">
                    
                    <div class="calendar">
                        <div class="calendar-header">
                            <div class="title">Calendar</div>
                            <div class="calendar-controllers">
                                <button type="button" class="small-btn" aria-hidden="true">◀</button>
                                <h3 class="month-year">February 2026</h3>
                                <button type="button" class="small-btn" aria-hidden="true">▶</button>
                            </div>
                        </div>
                        <div class="calendar-grid">
                            <div class="day-name">M</div>
                            <div class="day-name">T</div>
                            <div class="day-name">W</div>
                            <div class="day-name">T</div>
                            <div class="day-name">F</div>
                            <div class="day-name">S</div>
                            <div class="day-name">S</div>
                            <div class="day">1</div><div class="day">2</div><div class="day">3</div><div class="day">4</div><div class="day">5</div><div class="day">6</div><div class="day">7</div>
                            <div class="day">8</div><div class="day">9</div><div class="day">10</div><div class="day">11</div><div class="day">12</div><div class="day">13</div><div class="day">14</div>
                            <div class="day">15</div><div class="day">16</div><div class="day">17</div><div class="day">18</div><div class="day">19</div><div class="day">20</div><div class="day">21</div>
                            <div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="time">Hour</label>
                        <div class="preset-times">
                            <button type="button" class="preset">08:00</button>
                            <button type="button" class="preset">09:30</button>
                            <button type="button" class="preset">11:00</button>
                            <button type="button" class="preset">12:00</button>
                            <button type="button" class="preset">14:00</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="people">Participants</label>
                        <div class="people-selector">
                            <button type="button" class="people-btn">−</button>
                            <input type="number" id="people" name="people" value="1" min="1" max="20" required>
                            <button type="button" class="people-btn">+</button>
                        </div>
                    </div>
                    <button type="submit" class="reserve-btn">Make Reservation</button>
                </form>
            </div>
        </aside>

    </div>
</main>
