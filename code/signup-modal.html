<div class="modal-overlay signup-modal" id="signupModal">

    <div class="modal-wrapper">

        <button class="close-btn" onclick="closeModal('signupModal')"> &times; </button>

        <form action="">

            <h1>Sign Up</h1>

            <div class="input-box">
                <input type="text" required>
                <label> Full name </label>
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input type="text" required>
                <label> Username </label>
                <i class='bx bxs-user'></i> 
            </div>

            <div class="input-box">
                <input type="text" onfocus="this.type='date'" onblur="if(!this.value) this.type='text'" required>
                <label> Birthday </label>
                <i class='bx bxs-calendar'></i>
            </div>

            <div class="input-box select-wrapper">
                <select required>
                    <option value="" disabled selected hidden></option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <label> Gender </label>
                <i class='bx bx-caret-down'></i>
            </div>
            
            <div class="input-box">
                <input type="tel" required>
                <label> Phone number </label>
                <i class='bx bxs-phone'></i>
            </div>

            <div class="input-box">
                <input type="email" required>
                <label> Email address </label>
                <i class='bx bxs-envelope'></i>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label> Password </label>
                <i class='bx bxs-lock-alt' ></i>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label> Confirm Password </label>
                <i class='bx bxs-lock-alt' ></i>
            </div>

            <div class="signup-terms modal-checkbox-row">
                <label> <input type="checkbox"> I agree to the terms & conditions </label>
            </div>

            <button type="submit" class="btn-submit"> Create account </button>
            
            <div class="signup-link">
                <p> Already have an account? <a href="#" onclick="closeModal('signupModal'); loadAndOpenModal('login-modal.html', 'loginModal'); return false;"> Log In </a> </p>
            </div>

        </form>

    </div>
    
</div>
