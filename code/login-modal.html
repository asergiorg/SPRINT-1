<div class="modal-overlay login-modal" id="loginModal">

    <div class="modal-wrapper">

        <button class="close-btn" onclick="closeModal('loginModal')"> &times; </button>

        <form action="#" method="POST">

            <h1>Log In</h1>

            <div class="input-box">
                <input 
                    type="text" 
                    name="username" 
                    placeholder=" " 
                    required 
                    minlength="3" 
                    maxlength="20" 
                    pattern="^[A-Z][a-zA-Z0-9_]{2,19}$" 
                    title="El usuario debe comenzar con una letra mayúscula, tener entre 3 y 20 caracteres y solo puede contener letras, números y guiones bajos">
                <label> Username </label>
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input 
                    type="password" 
                    name="password" 
                    placeholder=" " 
                    required 
                    minlength="8" 
                    title="La contraseña debe tener al menos 8 caracteres">
                <label> Password </label>
                <i class='bx bxs-lock-alt' ></i>
            </div>

            <div class="login-remember-forgot modal-checkbox-row">
                <label> <input type="checkbox" name="remember"> Remember me </label>
                <a href="#"> Forgot password? </a>
            </div>

            <button type="submit" class="btn-submit"> Log In </button>
            
            <div class="signup-link">
                <p> Don't have an account? <a href="#" onclick="closeModal('loginModal'); loadAndOpenModal('signup-modal.html', 'signupModal'); return false;"> Sign Up </a> </p>
            </div>

        </form>

    </div>
    
</div>
