<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="This is a page with the information of a particular reservation">
        <meta name="keywords" content="HTML5, CSS3, JavaScript">
        <title>Reservation Information</title>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet for edit icon'>
        <link rel="stylesheet for the page" href="css/reservation-information.css">
    </head>
    <body>
        <main class="container">
            <header><h1>Reservation Information</h1></header>
            <section id="content">
                <article id="reservation-card" class="card" data-content-id="reservations" data-json="json/reservations.json" aria-labelledby="res-id">
                        <header class="card-header">
                            <a href="activity-information.html"><div class="title" data-field="activity"></div></a>
                            <i class='bx bxs-edit-alt' onclick="location.href='activity-information.html'"></i>
                        </header>

                        <div class="row"><dt>Reservation Holder</dt><dd id="row-name" data-field="holder"></dd></div>
                        <div class="row"><dt>Date</dt><dd id="row-date" data-field="date"></dd></div>
                        <div class="row"><dt>Time</dt><dd id="row-time" data-field="time"></dd></div>
                        <div class="row"><dt>Participants</dt><dd id="row-people" data-field="participants"></dd></div>
                        <div class="row"><dt>Price</dt><dd id="row-price" data-field="price"></dd></div>
                        <div class="row"><dt>Status</dt><dd id="row-status" data-field="status"></dd></div>

                    <footer class="actions">
                        <button id="confirm" onclick="location.href='user-activities.html'">Confirm</button>
                        <button id="cancel" onclick="location.href='activity-information.html'">Cancel</button>
                    </footer>
                </article>
            </section>
        </main>

        <script src="scripts/reservation-information-loader.js"></script>

    </body>
</html>
