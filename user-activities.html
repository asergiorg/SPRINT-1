<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My activities</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="css/user-activities.css">
</head>
<body>
  <div id="header-container" xlu-include-file="header.html"></div>
  <main class="container">
    
    <section class="page-header">
      <h1>User activities</h1>
    </section>
    <!-- Reservadas -->
    <section class="section-card" aria-labelledby="reserved-title">
      <h2 id="reserved-title">Reserved activities</h2>
      <div class="activities-list">
         <!-- Ejemplo de item estático: -->
        <article class="activity-card" xlu-include-file="reservation-card.html" onclick="location.href='reservation-information.html'"></article>
        <article class="activity-card" xlu-include-file="reservation-card.html" onclick="location.href='reservation-information.html'"></article>
        <article class="activity-card" xlu-include-file="reservation-card.html" onclick="location.href='reservation-information.html'"></article>
        <article class="activity-card" xlu-include-file="reservation-card.html" onclick="location.href='reservation-information.html'"></article>
      </div>
      <div class="view-more" role="link" aria-label="Ver más actividades reservadas"><span>View more</span></div>
    </section>

    <!-- Participadas -->
    <section class="section-card" aria-labelledby="attended-title">
      <h2 id="attended-title">Attended activities</h2>
      <div class="activities-list">
        <div xlu-include-file="activity2.html"></div>
        <div xlu-include-file="activity2.html"></div>
        <div xlu-include-file="activity2.html"></div>
        <div xlu-include-file="activity2.html"></div>
      </div>
      <div class="view-more" role="link" aria-label="Ver más actividades participadas"><span>View more</span></div>
    </section>

    <!-- Recomendadas -->
    <section class="section-card" aria-labelledby="recommended-title">
      <h2 id="recommended-title">Recommended activities</h2>
      <div class="activities-list">
        <div xlu-include-file="activity2.html"></div>
        <div xlu-include-file="activity2.html"></div>
        <div xlu-include-file="activity2.html"></div>
        <div xlu-include-file="activity2.html"></div>
      </div>
      <div class="view-more" role="link" aria-label="Ver más actividades recomendadas"><span>View more</span></div>
    </section>
  </main>

  <div id="footer-container" xlu-include-file="footer.html"></div>

  <script src="scripts/xlu-include-file.js"></script>
  <script src="scripts/header.js"></script>
  <script>
      document.addEventListener('DOMContentLoaded', function() {
          xLuIncludeFile();
      });
  </script>
</body>
</html>
