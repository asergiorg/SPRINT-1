<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My activities</title>
  <style>
    :root{
        --card-bg:#fff;
        --muted:#6b7280;
        --accent:#0f62fe
    }

    body{
        font-family:Inter,Arial,Helvetica,sans-serif;
        background:#f4f6fb;
        color:#111;
        margin:0;
        padding:0
    }

    .container{
        margin:0 auto;
        padding:0 28px;
    }

    header.page-header{
        margin-bottom:20px
    }

    header.page-header h1{
        font-size:24px;
        margin:0
    }

    .section-card{
        background:var(--card-bg);
        padding:18px;
        border-radius:12px;
        box-shadow:0 6px 18px rgba(16,24,40,0.06);
        margin-bottom:20px
    }

    .section-card h2{
        font-size:18px;
        margin:0 0 12px 0
    }

    .activities-list{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:12px
    }

    /* View more */
    .view-more{
        display:flex;
        align-items:center;
        justify-content:center;
        border-top:1px solid #eef2ff;
        padding:12px;
        margin-top:12px;
        border-radius:0 0 12px 12px;
        background:linear-gradient(0deg,#fff,transparent)
    }

    .view-more span{
        color:var(--accent);
        font-weight:600
    }
    
  </style>
</head>
<body>
  <div id="header-container" xlu-include-file="header.html"></div>
  <main class="container">
    
    <section class="page-header">
      <h1>User activities</h1>
    </section>
    <!-- Reservadas -->
    <section class="section-card" aria-labelledby="reserved-title">
      <h2 id="reserved-title">Reserved activities</h2>
      <div class="activities-list">
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
      </div>
      <div class="view-more" role="link" aria-label="Ver más actividades reservadas"><span>View more</span></div>
    </section>

    <!-- Participadas -->
    <section class="section-card" aria-labelledby="attended-title">
      <h2 id="attended-title">Attended activities</h2>
      <div class="activities-list">
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
      </div>
      <div class="view-more" role="link" aria-label="Ver más actividades participadas"><span>View more</span></div>
    </section>

    <!-- Recomendadas -->
    <section class="section-card" aria-labelledby="recommended-title">
      <h2 id="recommended-title">Recommended activities</h2>
      <div class="activities-list">
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
        <article xlu-include-file="activity2.html"></article>
      </div>
      <div class="view-more" role="link" aria-label="Ver más actividades recomendadas"><span>View more</span></div>
    </section>
  </main>

  <div id="footer-container" xlu-include-file="footer.html"></div>

  <script src="scripts/xlu-include-file.js"></script>
  <script src="scripts/header.js"></script>
  <script>
      document.addEventListener('DOMContentLoaded', function() {
          xLuIncludeFile();
      });
  </script>
</body>
</html>
